<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --card:#FFFFFF; --ink:#16171A; --muted:#86867E;
  --rule:#E3E3DC; --hair:#F0F0EA; --accent:#0F6B5C; --accent-soft:#E8F1EE;
  --warn:#A8710F; --warn-soft:#F6F0E4; --danger:#9B3B2E;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans JP","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:36px 0 20px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-family:var(--mono);font-weight:500;font-size:25px;letter-spacing:-.02em;margin:0}
h1 .dot{color:var(--accent)}
.headright{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.whoami{font-family:var(--mono);font-size:11px;padding:7px 10px;border:1px solid var(--rule);background:var(--card);width:120px}
.langs{display:flex;border:1px solid var(--rule);background:var(--card)}
.langs button{font-family:var(--mono);font-size:11px;padding:7px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-right:1px solid var(--rule)}
.langs button:last-child{border-right:0}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}

.tabs{display:flex;gap:26px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.tabs button{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;padding:12px 0;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .badge-count{font-size:10px;color:var(--accent);margin-left:5px}

section{padding:28px 0;border-bottom:1px solid var(--rule)}
section:last-child{border-bottom:0}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.sec-label .n{color:var(--accent)}

textarea#brief{width:100%;min-height:96px;resize:vertical;padding:15px;font-family:var(--sans);font-size:15px;line-height:1.7;background:var(--card);border:1px solid var(--rule);color:var(--ink)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
button.act{font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.act.ghost{background:transparent;color:var(--ink)}
button.act.sm{padding:6px 12px;font-size:11px}
button.act:disabled{opacity:.4;cursor:not-allowed}
button.act:focus-visible,.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted)}
.examples{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.examples button{font-family:var(--mono);font-size:11px;padding:5px 10px;cursor:pointer;background:var(--card);border:1px dashed var(--rule);color:var(--muted)}
.examples button:hover{border-color:var(--accent);color:var(--accent)}

.tier{margin-bottom:24px}
.tier-head{font-family:var(--mono);font-size:10px;letter-spacing:.14em;display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.badge{padding:2px 7px;font-size:9px;letter-spacing:.1em}
.badge.hard{background:var(--accent-soft);color:var(--accent)}
.badge.est{background:var(--warn-soft);color:var(--warn)}
.tier-note{color:var(--muted);font-family:var(--sans);letter-spacing:0;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:9px 11px;font-family:var(--mono);font-size:13px;background:var(--card);border:1px solid var(--rule);color:var(--ink)}
.pair{display:flex;gap:8px;align-items:center}
.pair span{color:var(--muted);font-family:var(--mono)}
.check{display:flex;align-items:center;gap:8px;padding-top:21px}
.check input{width:15px;height:15px;accent-color:var(--accent)}
.check label{font-family:var(--sans);font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}

.status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status .live::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;background:var(--accent);border-radius:50%;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.status .live::before{animation:none}}

.summary{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:18px;flex-wrap:wrap}
.summary b{color:var(--ink);font-weight:500}
.refine{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;background:var(--card);border:1px solid var(--rule);margin-bottom:-1px}
.refine input,.refine select{font-family:var(--mono);font-size:12px;padding:7px 9px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.refine input[type=text]{min-width:170px}
.refine input[type=number]{width:96px}
.refine .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.refine .spacer{flex:1}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);background:var(--card)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:10px 11px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .arrow{color:var(--accent);margin-left:4px}
td{padding:10px 11px;border-bottom:1px solid var(--hair);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FCFCFA}
td a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
td a:hover{color:var(--accent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bio{font-family:var(--sans);color:var(--muted);font-size:11px;max-width:220px}
.conf{display:inline-block;width:6px;height:6px;margin-left:6px;vertical-align:middle;border:1px solid var(--muted)}
.conf.high{background:var(--accent);border-color:var(--accent)}
.conf.medium{background:var(--muted)}
.conf.low{background:transparent}
.conf.unknown{border-style:dotted;opacity:.5}
.empty{padding:38px 16px;text-align:center;color:var(--muted);font-size:13px}
.legend{margin-top:13px;font-size:11px;color:var(--muted);line-height:1.9}
.err{border-left:2px solid var(--danger);background:#FBF3F1;padding:11px 13px;font-size:13px;margin-top:13px}
.hidden{display:none}

.savebtn{font-family:var(--mono);font-size:11px;padding:4px 9px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);cursor:pointer;white-space:nowrap}
.savebtn:hover{border-color:var(--accent);color:var(--accent)}
.savebtn.saved{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rowcheck{width:14px;height:14px;accent-color:var(--accent)}

.lists-layout{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.lists-layout{grid-template-columns:1fr}}
.listnav{border:1px solid var(--rule);background:var(--card)}
.listnav button.item{display:block;width:100%;text-align:left;padding:11px 13px;border:0;border-bottom:1px solid var(--hair);background:none;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ink)}
.listnav button.item:last-of-type{border-bottom:0}
.listnav button.item[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.listnav .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);float:right}
.newlist{display:flex;gap:0;border-top:1px solid var(--rule)}
.newlist input{flex:1;min-width:0;padding:10px 11px;border:0;font-family:var(--sans);font-size:13px;background:var(--paper)}
.newlist button{border:0;border-left:1px solid var(--rule);background:var(--card);padding:0 14px;cursor:pointer;font-family:var(--mono);font-size:15px;color:var(--accent)}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.listtitle{font-family:var(--mono);font-size:16px}
.statussel{font-family:var(--mono);font-size:11px;padding:3px 5px;border:1px solid var(--rule);background:var(--paper)}
.noteinput{font-family:var(--sans);font-size:12px;padding:4px 6px;border:1px solid var(--hair);background:var(--paper);width:100%;min-width:110px}
.noteinput:focus{border-color:var(--accent)}
.iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:13px;padding:2px 5px}
.iconbtn:hover{color:var(--danger)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;padding:11px 18px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
dialog{border:1px solid var(--rule);background:var(--card);padding:22px;font-family:var(--sans);max-width:340px}
dialog::backdrop{background:rgba(22,23,26,.28)}
dialog h3{font-family:var(--mono);font-size:13px;margin:0 0 14px;font-weight:500}
dialog select,dialog input{width:100%;padding:9px 10px;border:1px solid var(--rule);font-family:var(--sans);font-size:13px;margin-bottom:12px;background:var(--paper)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1>influencer<span class="dot">·</span>radar</h1>
  </div>
  <div class="headright">
    <input class="whoami" id="whoami" data-i18n-ph="whoamiPh">
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="ja" aria-pressed="true">日本語</button>
      <button data-lang="en" aria-pressed="false">English</button>
      <button data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
</header>

<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="search" data-i18n="tabSearch"></button>
  <button role="tab" aria-selected="false" data-tab="lists">
    <span data-i18n="tabLists"></span><span class="badge-count" id="listsCount"></span>
  </button>
</div>

<!-- ==================== 検索タブ ==================== -->
<div id="tab-search">

<section>
  <div class="sec-label"><span class="n">01</span><span data-i18n="briefTitle"></span></div>
  <textarea id="brief" data-i18n-ph="briefPh"></textarea>
  <div class="row">
    <button class="act" id="parseBtn" data-i18n="parseBtn"></button>
    <span class="hint" id="parseHint"></span>
  </div>
  <div class="examples" id="examples"></div>
  <div class="err hidden" id="parseErr"></div>
</section>

<section>
  <div class="sec-label"><span class="n">02</span><span data-i18n="condTitle"></span></div>

  <div class="tier">
    <div class="tier-head">
      <span class="badge hard" data-i18n="hardBadge"></span>
      <span class="tier-note" data-i18n="hardNote"></span>
    </div>
    <div class="grid">
      <div class="field"><label data-i18n="fHashtag"></label><input id="hashtag" placeholder="筋トレ"></div>
      <div class="field"><label data-i18n="fFollowers"></label>
        <div class="pair"><input id="minF" type="number" value="10000"><span>–</span><input id="maxF" type="number" value="70000"></div>
      </div>
      <div class="field"><label data-i18n="fActive"></label><input id="activeDays" type="number" value="90"></div>
      <div class="field"><label data-i18n="fEr"></label><input id="minEr" type="number" step="0.1" value="0"></div>
    </div>
  </div>

  <div class="tier">
    <div class="tier-head">
      <span class="badge est" data-i18n="estBadge"></span>
      <span class="tier-note" data-i18n="estNote"></span>
    </div>
    <div class="grid">
      <div class="field"><label data-i18n="fGender"></label>
        <select id="gender">
          <option value="any" data-i18n="gAny"></option>
          <option value="female" data-i18n="gF"></option>
          <option value="male" data-i18n="gM"></option>
        </select>
      </div>
      <div class="field"><label data-i18n="fAge"></label>
        <div class="pair"><input id="ageMin" type="number" placeholder="—"><span>–</span><input id="ageMax" type="number" placeholder="—"></div>
      </div>
      <div class="field"><label data-i18n="fContent"></label><input id="contentKw" placeholder="宅トレ, 減量"></div>
      <div class="field check"><input type="checkbox" id="narration"><label for="narration" data-i18n="fNarration"></label></div>
    </div>
  </div>

  <div class="row">
    <button class="act" id="runBtn" data-i18n="runBtn"></button>
    <label class="hint" style="display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="useLlm" checked style="accent-color:var(--accent)">
      <span data-i18n="useLlm"></span>
    </label>
    <span class="status" id="status"></span>
  </div>
  <div class="err hidden" id="runErr"></div>
</section>

<section id="resultsSec" class="hidden">
  <div class="sec-label"><span class="n">03</span><span data-i18n="resTitle"></span></div>
  <div class="summary" id="summary"></div>

  <div class="refine">
    <span class="lbl" data-i18n="refine"></span>
    <input type="text" id="rq" data-i18n-ph="rqPh">
    <input type="number" id="rMinF" data-i18n-ph="rMinFPh">
    <input type="number" id="rMinEr" step="0.1" data-i18n-ph="rMinErPh">
    <select id="rGender">
      <option value="" data-i18n="gAny"></option>
      <option value="female" data-i18n="gF"></option>
      <option value="male" data-i18n="gM"></option>
    </select>
    <select id="rNarr">
      <option value="" data-i18n="nAny"></option>
      <option value="yes" data-i18n="nYes"></option>
      <option value="no" data-i18n="nNo"></option>
    </select>
    <span class="spacer"></span>
    <button class="act ghost sm" id="saveSelBtn" data-i18n="saveSel"></button>
    <button class="act ghost sm" id="csvBtn" data-i18n="csvBtn"></button>
  </div>

  <div class="tablewrap"><table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
  <div class="legend" id="legend"></div>
</section>
</div>

<!-- ==================== リストタブ ==================== -->
<div id="tab-lists" class="hidden">
<section>
  <div class="lists-layout">
    <div>
      <div class="listnav" id="listnav"></div>
    </div>
    <div>
      <div class="listhead">
        <div class="listtitle" id="listTitle"></div>
        <div class="row" style="margin:0">
          <button class="act ghost sm" id="listCsvBtn" data-i18n="csvBtn"></button>
          <button class="act ghost sm" id="listRenameBtn" data-i18n="rename"></button>
          <button class="act ghost sm" id="listDelBtn" data-i18n="deleteList"></button>
        </div>
      </div>
      <div class="refine">
        <span class="lbl" data-i18n="refine"></span>
        <input type="text" id="lq" data-i18n-ph="rqPh">
        <select id="lStatus"><option value="" data-i18n="stAll"></option></select>
      </div>
      <div class="tablewrap"><table>
        <thead><tr id="lthead"></tr></thead>
        <tbody id="ltbody"></tbody>
      </table></div>
      <div class="legend" data-i18n="listLegend"></div>
    </div>
  </div>
</section>
</div>

</div>

<div class="toast" id="toast"></div>

<dialog id="saveDlg">
  <h3 data-i18n="saveTitle"></h3>
  <select id="dlgList"></select>
  <input id="dlgNew" data-i18n-ph="newListPh">
  <div class="row" style="margin:0;justify-content:flex-end">
    <button class="act ghost sm" id="dlgCancel" data-i18n="cancel"></button>
    <button class="act sm" id="dlgSave" data-i18n="save"></button>
  </div>
</dialog>

<script>
const HAS_AI = {{ 'true' if has_ai else 'false' }};

const I18N = {
ja:{
  eyebrow:"Instagram KOL ソーシング", whoamiPh:"あなたの名前",
  tabSearch:"検索", tabLists:"リスト",
  briefTitle:"やりたいことを書く",
  briefPh:"例：日本の宅トレ系の女性インフルエンサーを探したい。フォロワーは1万〜7万くらい、ちゃんと喋ってる動画を出してる人がいい。最近も動いてるアカウントで。",
  parseBtn:"条件に変換", parseHint:"書いた文章を下の条件に落とし込みます",
  parseHintNoAI:"ANTHROPIC_API_KEY が未設定のため、条件は手入力してください",
  condTitle:"条件を確認する",
  hardBadge:"実データ", hardNote:"API から直接取得。そのまま絞り込みに使える。",
  estBadge:"推定", estNote:"API に無い項目。bio・キャプション・音源から推定するため、必ず目視確認が必要。",
  fHashtag:"ハッシュタグ", fFollowers:"フォロワー数", fActive:"アクティブ（日数以内）",
  fEr:"最低エンゲージメント率 %", fGender:"性別", fAge:"年齢",
  fContent:"投稿内容キーワード", fNarration:"ナレーションありのみ",
  gAny:"性別すべて", gF:"女性", gM:"男性",
  nAny:"ナレーションすべて", nYes:"ナレーションあり", nNo:"ナレーションなし",
  useLlm:"AI 推定を使う（精度は上がるが実行コストが増える）",
  runBtn:"検索する", csvBtn:"CSV を保存", resTitle:"結果",
  refine:"絞り込み", rqPh:"アカウント・bio で検索", rMinFPh:"最低フォロワー", rMinErPh:"最低ER%",
  saveSel:"選択をリストに保存", saveTitle:"リストに保存",
  newListPh:"または新しいリスト名を入力", cancel:"やめる", save:"保存",
  rename:"名前を変更", deleteList:"リストを削除",
  stAll:"ステータスすべて",
  statuses:{new:"未対応",contacted:"連絡済",negotiating:"交渉中",approved:"採用",rejected:"見送り"},
  examples:["宅トレ系の女性、フォロワー1万〜5万、喋ってる動画",
            "プロテイン紹介してる男性、3万〜7万、直近1ヶ月に投稿あり",
            "ヨガ・ピラティス、20代、エンゲージメント率3%以上"],
  cols:{username:"アカウント",followers:"フォロワー",engagement:"ER%",last_post:"最終投稿",
        narration:"ナレーション",gender:"性別",age:"年齢",content:"投稿内容",bio:"bio",
        save:"保存",note:"メモ",item_status:"ステータス",added_by:"追加者",del:""},
  narr:{yes:"あり",partial:"一部",no:"なし",unknown:"不明"},
  gen:{female:"女性",male:"男性",unknown:"不明"},
  stages:{queued:"待機中",fetching_posts:"投稿を取得中",filtering:"絞り込み中",done:"完了",error:"エラー"},
  accountsFound:n=>`アカウント ${n} 件を発見、プロフィール取得中`,
  profiles:(a,b)=>`プロフィール取得中 ${a} / ${b}`,
  summary:(p,a,m,s)=>[`投稿 <b>${p}</b>`,`アカウント <b>${a}</b>`,`条件合致 <b>${m}</b>`,`表示中 <b>${s}</b>`],
  empty:"条件に合うアカウントがありませんでした。フォロワー範囲を広げるか、別のハッシュタグを試してください。",
  emptyList:"まだ誰も入っていません。検索結果から「保存」で追加してください。",
  noLists:"リストがありません。下の欄に名前を入れて作成してください。",
  legend:"確度：<span class='conf high'></span> 高 ／ <span class='conf medium'></span> 中 ／ <span class='conf low'></span> 低 ／ <span class='conf unknown'></span> 不明。低・不明のものは推測が弱いので必ず本人のアカウントを確認してください。年齢は bio に記載がある場合のみ取得できるため、多くが不明になります。",
  listLegend:"メモとステータスは自動保存されます。CSV には推定値も確度も含まれます。",
  errParse:"変換に失敗しました：", errRun:"検索に失敗しました：",
  errNoHashtag:"ハッシュタグを入力してください",

let LANG = localStorage.getItem("radar_lang") || "ja";
let TAB = "search";
let RESULTS = [], STATS = null, JOB_ID = null, pollTimer = null;
let SORT = {key:"followers", dir:-1};
let LSORT = {key:"added_at", dir:-1};
let LISTS = [], CUR_LIST = null, ITEMS = [];
let pendingSave = [];

const $ = id => document.getElementById(id);
const t = () => I18N[LANG];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"), 2200);
}
function showErr(el,msg){ el.textContent = msg; el.classList.remove("hidden"); }
function hideErr(el){ el.classList.add("hidden"); }
const me = () => $("whoami").value.trim();

async function api(url, opts={}){
  const res = await fetch(url, {
    headers:{"Content-Type":"application/json","X-Radar-User":me()},
    ...opts
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

/* ---------------- language ---------------- */
function applyLang(){
  document.documentElement.lang = LANG;
  const d = t();
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = d[el.dataset.i18n];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    el.placeholder = d[el.dataset.i18nPh] || "";
  });
  $("parseHint").textContent = HAS_AI ? d.parseHint : d.parseHintNoAI;
  $("parseBtn").disabled = !HAS_AI;
  $("legend").innerHTML = d.legend;

  $("examples").innerHTML = "";
  d.examples.forEach(ex=>{
    const b = document.createElement("button");
    b.textContent = ex;
    b.onclick = ()=>{ $("brief").value = ex; };
    $("examples").appendChild(b);
  });

  const sel = $("lStatus"), keep = sel.value;
  sel.innerHTML = `<option value="">${esc(d.stAll)}</option>` +
    Object.entries(d.statuses).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  sel.value = keep;

  document.querySelectorAll(".langs button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));

  if (RESULTS.length || STATS) renderResults();
  if (CUR_LIST) renderItems();
  renderListNav();
}

document.querySelectorAll(".langs button").forEach(b=>{
  b.onclick = ()=>{ LANG = b.dataset.lang; localStorage.setItem("radar_lang",LANG); applyLang(); };
});

/* ---------------- tabs ---------------- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = ()=>{
    TAB = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(x=>
      x.setAttribute("aria-selected", String(x.dataset.tab === TAB)));
    $("tab-search").classList.toggle("hidden", TAB !== "search");
    $("tab-lists").classList.toggle("hidden", TAB !== "lists");
    if (TAB === "lists") loadLists();
  };
});

$("whoami").value = localStorage.getItem("radar_user") || "";
$("whoami").oninput = ()=> localStorage.setItem("radar_user", $("whoami").value);

/* ---------------- brief -> filters ---------------- */
$("parseBtn").onclick = async ()=>{
  const brief = $("brief").value.trim();
  if (!brief) return;
  hideErr($("parseErr"));
  $("parseBtn").disabled = true; $("parseHint").textContent = "…";
  try{
    const {filters:f} = await api("/api/parse", {method:"POST",
      body: JSON.stringify({brief, lang: LANG})});
    $("hashtag").value = f.hashtag || "";
    $("minF").value = f.min_followers; $("maxF").value = f.max_followers;
    $("activeDays").value = f.active_days; $("minEr").value = f.min_engagement || 0;
    $("gender").value = f.gender || "any";
    $("ageMin").value = f.age_min ?? ""; $("ageMax").value = f.age_max ?? "";
    $("narration").checked = !!f.narration_only;
    $("contentKw").value = (f.content_keywords || []).join(", ");
    $("parseHint").textContent = f.notes || t().parseHint;
  }catch(e){
    showErr($("parseErr"), t().errParse + e.message);
    $("parseHint").textContent = t().parseHint;
  }finally{ $("parseBtn").disabled = false; }
};

/* ---------------- search ---------------- */
$("runBtn").onclick = async ()=>{
  const hashtag = $("hashtag").value.trim().replace(/^#/,"");
  hideErr($("runErr"));
  if (!hashtag){ showErr($("runErr"), t().errNoHashtag); return; }

  const params = {
    hashtag,
    min_followers:+$("minF").value || 0,
    max_followers:+$("maxF").value || 100000000,
    active_days:+$("activeDays").value || 90,
    min_engagement:+$("minEr").value || 0,
    gender:$("gender").value,
    age_min:$("ageMin").value ? +$("ageMin").value : null,
    age_max:$("ageMax").value ? +$("ageMax").value : null,
    narration_only:$("narration").checked,
    content_keywords:$("contentKw").value.split(",").map(s=>s.trim()).filter(Boolean),
    posts_limit:200,
    use_llm:$("useLlm").checked,
    user: me()
  };

  $("runBtn").disabled = true;
  $("status").innerHTML = `<span class="live">${esc(t().stages.queued)}</span>`;
  try{
    const {job_id} = await api("/api/search",{method:"POST",body:JSON.stringify(params)});
    JOB_ID = job_id;
    poll(job_id);
  }catch(e){
    showErr($("runErr"), t().errRun + e.message);
    $("runBtn").disabled = false; $("status").textContent = "";
  }
};

function stageText(stage){
  const d = t();
  if (!stage) return "";
  if (stage.startsWith("accounts_found:")) return d.accountsFound(stage.split(":")[1]);
  if (stage.startsWith("profiles:")){
    const [a,b] = stage.split(":")[1].split("/");
    return d.profiles(a,b);
  }
  return d.stages[stage] || stage;
}

function poll(jobId){
  clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    try{
      const job = await api(`/api/status/${jobId}`);
      $("status").innerHTML = `<span class="live">${esc(stageText(job.stage))}</span>`;
      if (job.status === "done"){
        clearInterval(pollTimer);
        RESULTS = job.results || []; STATS = job.stats;
        $("status").textContent = t().stages.done;
        $("runBtn").disabled = false;
        renderResults();
      }
      if (job.status === "error"){
        clearInterval(pollTimer);
        showErr($("runErr"), t().errRun + (job.error||""));
        $("status").textContent = ""; $("runBtn").disabled = false;
      }
    }catch(e){ /* 次のポーリングで再試行 */ }
  }, 2000);
}

/* ---------------- results: filter + sort + render ---------------- */
const COLS = ["username","followers","engagement","last_post","narration","gender","age","content","bio"];
const NUMERIC = new Set(["followers","engagement"]);

function visibleResults(){
  const q = $("rq").value.trim().toLowerCase();
  const minF = +$("rMinF").value || 0;
  const minEr = +$("rMinEr").value || 0;
  const g = $("rGender").value, n = $("rNarr").value;

  let rows = RESULTS.filter(r=>{
    if (r.followers < minF) return false;
    if (r.engagement < minEr) return false;
    if (g && r.gender !== g) return false;
    if (n === "yes" && !(r.narration === "yes" || r.narration === "partial")) return false;
    if (n === "no" && r.narration !== "no") return false;
    if (q && !(`${r.username} ${r.full_name} ${r.bio} ${r.content}`.toLowerCase().includes(q))) return false;
    return true;
  });

  const k = SORT.key;
  rows.sort((a,b)=>{
    let x = a[k], y = b[k];
    if (NUMERIC.has(k)){ x = +x||0; y = +y||0; return (x-y)*SORT.dir; }
    return String(x??"").localeCompare(String(y??"")) * SORT.dir;
  });
  return rows;
}

function renderResults(){
  const d = t();
  $("resultsSec").classList.remove("hidden");
  const rows = visibleResults();

  $("summary").innerHTML = STATS
    ? d.summary(STATS.posts, STATS.accounts, STATS.matched, rows.length).map(s=>`<span>${s}</span>`).join("")
    : "";

  $("thead").innerHTML =
    `<th class="nosort"><input type="checkbox" class="rowcheck" id="checkAll"></th>` +
    COLS.map(c=>{
      const arrow = SORT.key===c ? `<span class="arrow">${SORT.dir<0?"↓":"↑"}</span>` : "";
      return `<th data-sort="${c}">${esc(d.cols[c])}${arrow}</th>`;
    }).join("") +
    `<th class="nosort">${esc(d.cols.save)}</th>`;

  $("thead").querySelectorAll("th[data-sort]").forEach(th=>{
    th.onclick = ()=>{
      const k = th.dataset.sort;
      SORT = (SORT.key === k) ? {key:k, dir:-SORT.dir} : {key:k, dir: NUMERIC.has(k) ? -1 : 1};
      renderResults();
    };
  });
  $("checkAll").onchange = e=>{
    document.querySelectorAll("#tbody .rowcheck").forEach(cb=> cb.checked = e.target.checked);
  };

  if (!rows.length){
    $("tbody").innerHTML = `<tr><td colspan="${COLS.length+2}" class="empty">${esc(d.empty)}</td></tr>`;
    return;
  }

  $("tbody").innerHTML = rows.map(r=>`
    <tr data-u="${esc(r.username)}">
      <td><input type="checkbox" class="rowcheck"></td>
      <td><a href="${esc(r.url)}" target="_blank" rel="noopener">@${esc(r.username)}</a></td>
      <td class="num">${(+r.followers).toLocaleString()}</td>
      <td class="num">${esc(r.engagement)}</td>
      <td>${esc(r.last_post)}</td>
      <td>${esc(d.narr[r.narration] ?? r.narration)}<span class="conf ${esc(r.narration_conf)}"></span></td>
      <td>${esc(d.gen[r.gender] ?? r.gender)}<span class="conf ${esc(r.gender_conf)}"></span></td>
      <td>${esc(r.age === "unknown" ? d.gen.unknown : r.age)}<span class="conf ${esc(r.age_conf)}"></span></td>
      <td>${esc(r.content === "unknown" ? d.gen.unknown : r.content)}<span class="conf ${esc(r.content_conf)}"></span></td>
      <td class="bio">${esc(r.bio)}</td>
      <td><button class="savebtn" data-save="${esc(r.username)}">+</button></td>
    </tr>`).join("");

  $("tbody").querySelectorAll("[data-save]").forEach(b=>{
    b.onclick = ()=> openSave([RESULTS.find(r=>r.username === b.dataset.save)]);
  });
}

["rq","rMinF","rMinEr","rGender","rNarr"].forEach(id=>{
  $(id).addEventListener("input", ()=> RESULTS.length && renderResults());
});

$("csvBtn").onclick = ()=>{ if (JOB_ID) window.location = `/api/export/job/${JOB_ID}`; };

$("saveSelBtn").onclick = ()=>{
  const picked = [...document.querySelectorAll("#tbody tr")]
    .filter(tr => tr.querySelector(".rowcheck")?.checked)
    .map(tr => RESULTS.find(r=>r.username === tr.dataset.u))
    .filter(Boolean);
  if (!picked.length){ toast(t().selectFirst); return; }
  openSave(picked);
};

/* ---------------- save dialog ---------------- */
function openSave(items){
  pendingSave = items;
  const sel = $("dlgList");
  sel.innerHTML = LISTS.map(l=>`<option value="${l.id}">${esc(l.name)} (${l.count})</option>`).join("");
  $("dlgNew").value = "";
  loadLists().then(()=>{
    sel.innerHTML = LISTS.map(l=>`<option value="${l.id}">${esc(l.name)} (${l.count})</option>`).join("");
  });
  $("saveDlg").showModal();
}
$("dlgCancel").onclick = ()=> $("saveDlg").close();
$("dlgSave").onclick = async ()=>{
  const newName = $("dlgNew").value.trim();
  try{
    let listId, listName;
    if (newName){
      const created = await api("/api/lists",{method:"POST",body:JSON.stringify({name:newName,user:me()})});
      listId = created.id; listName = created.name;
    }else{
      listId = +$("dlgList").value;
      listName = LISTS.find(l=>l.id === listId)?.name || "";
    }
    if (!listId) return;
    await api(`/api/lists/${listId}/items`,{method:"POST",
      body: JSON.stringify({items: pendingSave, user: me()})});
    $("saveDlg").close();
    toast(t().savedTo(listName));
    await loadLists();
  }catch(e){
    toast(e.message === "duplicate_name" ? t().dupName : e.message);
  }
};

/* ---------------- lists ---------------- */
async function loadLists(){
  try{
    const {lists} = await api("/api/lists");
    LISTS = lists;
    $("listsCount").textContent = lists.length ? lists.length : "";
    renderListNav();
    if (TAB === "lists"){
      if (CUR_LIST && !lists.find(l=>l.id === CUR_LIST)) CUR_LIST = null;
      if (!CUR_LIST && lists.length) CUR_LIST = lists[0].id;
      if (CUR_LIST) await loadItems(CUR_LIST); else { ITEMS = []; renderItems(); }
    }
  }catch(e){ /* ignore */ }
  return LISTS;
}

function renderListNav(){
  const d = t();
  const nav = $("listnav");
  nav.innerHTML =
    (LISTS.length
      ? LISTS.map(l=>`<button class="item" data-list="${l.id}" aria-current="${l.id===CUR_LIST}">
           ${esc(l.name)}<span class="cnt">${l.count}</span></button>`).join("")
      : `<div class="empty" style="padding:22px 14px">${esc(d.noLists)}</div>`) +
    `<div class="newlist">
       <input id="newListName" placeholder="${esc(d.newListPh)}">
       <button id="newListBtn" title="add">+</button>
     </div>`;

  nav.querySelectorAll("[data-list]").forEach(b=>{
    b.onclick = ()=>{ CUR_LIST = +b.dataset.list; loadItems(CUR_LIST); renderListNav(); };
  });
  const add = async ()=>{
    const name = $("newListName").value.trim();
    if (!name) return;
    try{
      const created = await api("/api/lists",{method:"POST",body:JSON.stringify({name,user:me()})});
      CUR_LIST = created.id;
      await loadLists();
    }catch(e){ toast(e.message === "duplicate_name" ? t().dupName : e.message); }
  };
  $("newListBtn").onclick = add;
  $("newListName").onkeydown = e=>{ if (e.key === "Enter") add(); };
}

async function loadItems(listId){
  const {list, items} = await api(`/api/lists/${listId}`);
  CUR_LIST = list.id; ITEMS = items;
  $("listTitle").textContent = list.name;
  renderItems();
}

const LCOLS = ["username","followers","engagement","last_post","gender","content","item_status","note","added_by"];

function visibleItems(){
  const q = $("lq").value.trim().toLowerCase();
  const st = $("lStatus").value;
  let rows = ITEMS.filter(i=>{
    if (st && i.item_status !== st) return false;
    if (q && !(`${i.username} ${i.full_name} ${i.bio} ${i.note}`.toLowerCase().includes(q))) return false;
    return true;
  });
  const k = LSORT.key;
  rows.sort((a,b)=>{
    let x = a[k], y = b[k];
    if (NUMERIC.has(k)){ x=+x||0; y=+y||0; return (x-y)*LSORT.dir; }
    return String(x??"").localeCompare(String(y??"")) * LSORT.dir;
  });
  return rows;
}

function renderItems(){
  const d = t();
  $("lthead").innerHTML = LCOLS.map(c=>{
    const arrow = LSORT.key===c ? `<span class="arrow">${LSORT.dir<0?"↓":"↑"}</span>` : "";
    return `<th data-lsort="${c}">${esc(d.cols[c] || c)}${arrow}</th>`;
  }).join("") + `<th class="nosort"></th>`;

  $("lthead").querySelectorAll("th[data-lsort]").forEach(th=>{
    th.onclick = ()=>{
      const k = th.dataset.lsort;
      LSORT = (LSORT.key === k) ? {key:k,dir:-LSORT.dir} : {key:k, dir: NUMERIC.has(k) ? -1 : 1};
      renderItems();
    };
  });

  const rows = visibleItems();
  if (!rows.length){
    $("ltbody").innerHTML = `<tr><td colspan="${LCOLS.length+1}" class="empty">${esc(d.emptyList)}</td></tr>`;
    return;
  }

  $("ltbody").innerHTML = rows.map(i=>`
    <tr>
      <td><a href="${esc(i.url)}" target="_blank" rel="noopener">@${esc(i.username)}</a></td>
      <td class="num">${(+i.followers).toLocaleString()}</td>
      <td class="num">${esc(i.engagement)}</td>
      <td>${esc(i.last_post)}</td>
      <td>${esc(d.gen[i.gender] ?? i.gender)}<span class="conf ${esc(i.gender_conf)}"></span></td>
      <td>${esc(i.content === "unknown" ? d.gen.unknown : i.content)}</td>
      <td><select class="statussel" data-item="${i.item_id}">
        ${Object.entries(d.statuses).map(([k,v])=>
          `<option value="${k}" ${i.item_status===k?"selected":""}>${esc(v)}</option>`).join("")}
      </select></td>
      <td><input class="noteinput" data-note="${i.item_id}" value="${esc(i.note)}"></td>
      <td>${esc(i.added_by)}</td>
      <td><button class="iconbtn" data-del="${i.item_id}">×</button></td>
    </tr>`).join("");

  $("ltbody").querySelectorAll("[data-item]").forEach(sel=>{
    sel.onchange = async ()=>{
      await api(`/api/items/${sel.dataset.item}`,{method:"PATCH",
        body:JSON.stringify({status:sel.value})});
      const it = ITEMS.find(x=>String(x.item_id)===sel.dataset.item);
      if (it) it.item_status = sel.value;
    };
  });
  $("ltbody").querySelectorAll("[data-note]").forEach(inp=>{
    let timer;
    inp.oninput = ()=>{
      clearTimeout(timer);
      timer = setTimeout(async ()=>{
        await api(`/api/items/${inp.dataset.note}`,{method:"PATCH",
          body:JSON.stringify({note:inp.value})});
        const it = ITEMS.find(x=>String(x.item_id)===inp.dataset.note);
        if (it) it.note = inp.value;
      }, 600);
    };
  });
  $("ltbody").querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = async ()=>{
      await api(`/api/items/${b.dataset.del}`,{method:"DELETE"});
      ITEMS = ITEMS.filter(x=>String(x.item_id)!==b.dataset.del);
      renderItems(); loadLists();
    };
  });
}

["lq","lStatus"].forEach(id=> $(id).addEventListener("input", ()=> CUR_LIST && renderItems()));

$("listCsvBtn").onclick = ()=>{ if (CUR_LIST) window.location = `/api/export/list/${CUR_LIST}`; };
$("listRenameBtn").onclick = async ()=>{
  if (!CUR_LIST) return;
  const cur = LISTS.find(l=>l.id === CUR_LIST);
  const name = prompt(t().rename, cur?.name || "");
  if (!name) return;
  try{
    await api(`/api/lists/${CUR_LIST}`,{method:"PATCH",body:JSON.stringify({name})});
    await loadLists(); $("listTitle").textContent = name;
  }catch(e){ toast(e.message === "duplicate_name" ? t().dupName : e.message); }
};
$("listDelBtn").onclick = async ()=>{
  if (!CUR_LIST) return;
  const cur = LISTS.find(l=>l.id === CUR_LIST);
  if (!confirm(t().confirmDel(cur?.name || ""))) return;
  await api(`/api/lists/${CUR_LIST}`,{method:"DELETE"});
  CUR_LIST = null; ITEMS = [];
  $("listTitle").textContent = "";
  await loadLists(); renderItems();
};

applyLang();
loadLists();
</script>
</body>
</html>
