<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --panel:#F4F4EF; --card:#FFFFFF;
  --ink:#16171A; --dim:#6E6E67; --muted:#98988F;
  --rule:#DEDED6; --hair:#EDEDE6;
  --accent:#0F6B5C; --accent-soft:#E4EFEC;
  --warn:#A8710F; --warn-soft:#F5EFE2; --danger:#9B3B2E;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans JP","IBM Plex Sans",system-ui,sans-serif;
  --bar:44px; --panelw:376px; --navw:196px; --lblw:118px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}

/* ===== app shell ===== */
.app{height:100dvh;display:grid;grid-template-rows:var(--bar) 1fr}

.bar{
  display:flex;align-items:center;gap:22px;padding:0 14px;
  border-bottom:1px solid var(--rule);background:var(--card);
}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:-.01em;white-space:nowrap}
.brand .dot{color:var(--accent)}
.navtabs{display:flex;gap:2px}
.navtabs button{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  padding:5px 12px;border:1px solid transparent;background:none;color:var(--dim);cursor:pointer;
}
.navtabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.navtabs .cnt{font-size:10px;opacity:.65;margin-left:5px}
.bar .push{flex:1}
.langs{display:flex;border:1px solid var(--rule)}
.langs button{
  font-family:var(--mono);font-size:10px;padding:5px 9px;border:0;
  border-right:1px solid var(--rule);background:var(--card);color:var(--dim);cursor:pointer;
}
.langs button:last-child{border-right:0}
.langs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

/* ===== two-pane views ===== */
.view{display:grid;min-height:0}
#view-search{grid-template-columns:var(--panelw) 1fr}
#view-lists{grid-template-columns:var(--navw) 1fr}
.view[hidden]{display:none}

/* ===== left panel ===== */
.panel{
  display:flex;flex-direction:column;min-height:0;
  background:var(--panel);border-right:1px solid var(--rule);
}
.panel-scroll{overflow-y:auto;padding:14px;flex:1;min-height:0}
.panel-foot{
  border-top:1px solid var(--rule);padding:10px 14px;background:var(--panel);
  display:flex;flex-direction:column;gap:7px;
}

.plabel{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:7px;margin:0 0 8px;
}
.plabel::after{content:"";flex:1;height:1px;background:var(--rule)}
.plabel.mt{margin-top:20px}
.tag{padding:2px 6px;font-size:8px;letter-spacing:.1em}
.tag.hard{background:var(--accent-soft);color:var(--accent)}
.tag.est{background:var(--warn-soft);color:var(--warn)}
.pnote{font-size:10.5px;color:var(--dim);line-height:1.6;margin:-3px 0 10px}

textarea#brief{
  width:100%;height:88px;resize:none;padding:9px 10px;
  font-size:12.5px;line-height:1.65;background:var(--card);
  border:1px solid var(--rule);
}
.chips{display:flex;flex-direction:column;gap:4px;margin-top:7px}
.chips button{
  text-align:left;font-size:10.5px;padding:5px 8px;cursor:pointer;
  background:transparent;border:1px dashed var(--rule);color:var(--dim);line-height:1.4;
}
.chips button:hover{border-color:var(--accent);border-style:solid;color:var(--accent)}

.f{
  display:grid;grid-template-columns:var(--lblw) 1fr;
  align-items:center;column-gap:10px;row-gap:2px;margin-bottom:9px;
}
.f>label{
  font-family:var(--sans);font-size:11.5px;font-weight:500;line-height:1.35;
  color:var(--ink);letter-spacing:0;text-transform:none;
}
.f>label .unit{font-size:10.5px;color:var(--dim);font-weight:400}
.f .help{
  grid-column:2;font-size:10px;color:var(--dim);line-height:1.45;
}
.f input,.f select{
  width:100%;padding:6px 8px;font-family:var(--mono);font-size:12px;
  background:var(--card);border:1px solid var(--rule);
}
.f input::placeholder{color:#B9B9B0}
.f.tall{align-items:start}
.f.tall>label{padding-top:6px}
.duo{display:flex;align-items:center;gap:6px}
.duo em{color:var(--muted);font-style:normal;font-family:var(--mono)}
/* .two は以前の上ラベル時代の名残。ラベルを左に置いた今、半分割すると
   入力欄が 40px 程度まで潰れるため、通常の1行フィールドとして流す。 */
.two{display:contents}
.tick{display:flex;align-items:center;gap:7px;margin:11px 0 3px;font-size:12px}
.tick input{width:14px;height:14px;accent-color:var(--accent);flex:none}
textarea.mini{
  width:100%;height:52px;resize:vertical;padding:6px 8px;
  font-family:var(--mono);font-size:11.5px;background:var(--card);border:1px solid var(--rule);
}
#hashtag.mini{height:40px}
.na{list-style:none;margin:0;padding:0}
.na li{
  font-size:10.5px;color:var(--muted);padding:4px 0 4px 13px;position:relative;line-height:1.45;
}
.na li::before{content:"×";position:absolute;left:0;color:var(--muted);opacity:.7}

.seg{display:flex;border:1px solid var(--rule)}
.seg-btn{
  flex:1;padding:6px 8px;border:0;background:var(--card);cursor:pointer;
  font-family:var(--sans);font-size:11px;color:var(--dim);
}
.seg-btn+.seg-btn{border-left:1px solid var(--rule)}
.seg-btn.active{background:var(--accent);color:#fff}
.seg-btn:hover:not(.active){background:var(--paper)}

/* ===== アバター ===== */
.avatar-th{width:34px}
.av{
  width:26px;height:26px;border-radius:50%;object-fit:cover;display:block;
  background:var(--card);border:1px solid var(--rule);
}
.av-fallback{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:var(--dim);
  background:var(--card);border:1px solid var(--rule);text-transform:uppercase;
}
.av-lg{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--rule);flex:none}

/* ===== 認証・グループ ===== */
.auth-wall{
  position:fixed;inset:0;z-index:300;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
}
.auth-card{width:320px;max-width:88vw}
.auth-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--accent);margin:0 0 6px}
.auth-card h2{font-size:16px;margin:0 0 16px;font-weight:600}
.auth-card .btn{width:100%;margin-top:8px}
.auth-msg{font-size:11px;color:var(--accent);min-height:15px;margin:6px 0 0}
.gsel{
  max-width:150px;padding:3px 6px;font-family:var(--sans);font-size:11px;
  background:var(--card);border:1px solid var(--rule);color:var(--ink);
}
.uname{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.grp-row{
  display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11.5px;
  border-bottom:1px solid var(--rule);
}
.grp-row .code{font-family:var(--mono);font-size:10px;color:var(--dim);cursor:pointer}
.grp-row .code:hover{color:var(--accent)}

.btn{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  padding:8px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.xs{padding:5px 10px;font-size:10.5px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.wide{width:100%}

.state{font-family:var(--mono);font-size:10.5px;color:var(--dim);min-height:15px;line-height:1.45}
.state .live::before{
  content:"";display:inline-block;width:5px;height:5px;margin-right:6px;
  background:var(--accent);border-radius:50%;animation:blip 1.2s ease-in-out infinite;
}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.18}}
@media(prefers-reduced-motion:reduce){.state .live::before{animation:none}}
.msg{font-size:11px;color:var(--danger);line-height:1.5}
.msg:empty{display:none}

/* ===== right pane ===== */
.pane{display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.toolbar{
  display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;
  padding:7px 12px;border-bottom:1px solid var(--rule);background:var(--card);
}
.toolbar .tl{
  font-family:var(--sans);font-size:11px;color:var(--dim);
  align-self:center;white-space:nowrap;
}
.tf{display:flex;flex-direction:column;gap:2px}
.tf>span{font-family:var(--sans);font-size:10px;color:var(--dim);white-space:nowrap}
.toolbar input,.toolbar select{
  padding:5px 7px;font-family:var(--mono);font-size:11px;
  border:1px solid var(--rule);background:var(--paper);
}
.toolbar input[type=text]{width:170px}
.toolbar input[type=number]{width:88px}
.toolbar .push{flex:1}
.toolbar .btn{align-self:flex-end}
.tick.inline{margin:0;font-size:11px;color:var(--dim);white-space:nowrap}

.scroller{flex:1;overflow:auto;min-height:0}
table{width:100%;border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:11.5px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--card);
  text-align:left;font-weight:500;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--rule);
  white-space:nowrap;cursor:pointer;user-select:none;
}
thead th.fixed{cursor:default}
thead th .ar{color:var(--accent);margin-left:3px}
tbody td{padding:5px 9px;border-bottom:1px solid var(--hair);vertical-align:middle}
tbody tr:hover td{background:var(--card)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.num.up{color:var(--accent)}
.num.down{color:var(--danger)}
.vf{color:var(--accent);font-size:9px;margin-left:3px}
.acct{white-space:nowrap}
.acct a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.acct a:hover{color:var(--accent)}
.bio{font-family:var(--sans);color:var(--dim);font-size:10.5px;max-width:300px;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf{display:inline-block;width:5px;height:5px;margin-left:5px;vertical-align:middle;border:1px solid var(--muted)}
.cf.high{background:var(--accent);border-color:var(--accent)}
.cf.medium{background:var(--muted)}
.cf.low{background:transparent}
.cf.unknown{border-style:dotted;opacity:.45}
.tick.row{margin:0}
.plus{
  font-family:var(--mono);font-size:11px;padding:2px 8px;cursor:pointer;
  background:transparent;border:1px solid var(--rule);color:var(--dim);
}
.plus:hover{border-color:var(--accent);color:var(--accent)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-family:var(--mono);padding:2px 5px}
.x:hover{color:var(--danger)}
.sel{font-family:var(--mono);font-size:10.5px;padding:2px 4px;border:1px solid var(--rule);background:var(--paper)}
.note{
  font-family:var(--sans);font-size:11px;padding:3px 5px;width:100%;min-width:120px;
  border:1px solid transparent;background:transparent;
}
.note:hover{border-color:var(--hair)}
.note:focus{border-color:var(--accent);background:var(--card)}

.blank{padding:44px 16px;text-align:center;color:var(--dim);font-size:12px;line-height:1.7}
.foot{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:6px 140px 6px 12px;border-top:1px solid var(--rule);background:var(--card);
  font-family:var(--mono);font-size:10px;color:var(--dim);
}
.foot b{color:var(--ink);font-weight:500}
.foot .push{flex:1}
.foot .key{display:flex;align-items:center;gap:4px}

/* ===== lists nav ===== */
.lnav{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--rule)}
.lsearch{padding:7px;border-bottom:1px solid var(--rule);background:var(--card)}
.lsearch input{width:100%;padding:5px 8px;font-size:11.5px;border:1px solid var(--rule);background:var(--paper)}
.lnav-scroll{flex:1;overflow-y:auto;min-height:0}

.fold{border-bottom:1px solid var(--hair)}
.fold>summary{
  list-style:none;cursor:pointer;padding:6px 10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:6px;
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸";font-size:9px;color:var(--muted);transition:transform .12s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary:hover{background:var(--card)}
.fold .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .tot{font-size:9px;color:var(--muted)}
.fold .fx{opacity:0;border:0;background:none;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:10px;padding:0 3px}
.fold>summary:hover .fx{opacity:1}
.fold .fx:hover{color:var(--danger)}

.lnav button.li{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  padding:6px 10px 6px 22px;border:0;border-bottom:1px solid var(--hair);
  background:none;cursor:pointer;font-size:12px;
}
.lnav button.li[aria-current="true"]{background:var(--card);box-shadow:inset 2px 0 0 var(--accent)}
.lnav button.li .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnav .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.loose button.li{padding-left:10px}
.lnew{display:flex;border-top:1px solid var(--rule)}
.lnew input{flex:1;min-width:0;padding:7px 10px;border:0;background:var(--card);font-size:11.5px}
.lnew button{border:0;border-left:1px solid var(--rule);background:var(--panel);
             padding:0 12px;cursor:pointer;font-family:var(--mono);color:var(--accent)}

.saved{
  font-family:var(--mono);font-size:9px;padding:1px 5px;margin-left:5px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap;
}
.plus.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.crumb{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* ===== overlays ===== */
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;
  padding:9px 15px;opacity:0;pointer-events:none;transition:opacity .16s;z-index:50;
}
.toast.on{opacity:1}
dialog{border:1px solid var(--rule);background:var(--card);padding:18px;max-width:300px;font-size:12.5px}
dialog::backdrop{background:rgba(22,23,26,.3)}
dialog h3{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;
          text-transform:uppercase;color:var(--muted);margin:0 0 12px}
dialog select,dialog input{width:100%;padding:7px 9px;border:1px solid var(--rule);
                           background:var(--paper);margin-bottom:9px;font-size:12.5px}
.dlgrow{display:flex;justify-content:flex-end;gap:7px}

/* ===== 透かし ===== */
.wmark{
  position:fixed;right:10px;bottom:8px;z-index:40;
  font-family:var(--mono);font-size:9.5px;color:var(--muted);
  text-decoration:none;opacity:.55;letter-spacing:.02em;
  background:var(--paper);padding:2px 5px;
}
.wmark:hover{opacity:1;color:var(--accent)}

/* ===== 品質バッジ ===== */
.q{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;cursor:pointer}
.q.ok{background:var(--accent)}
.q.warn{background:var(--warn)}
.q.risk{background:var(--danger)}
.qbadge{font-family:var(--mono);font-size:10px;padding:2px 8px;vertical-align:middle}
.qbadge.ok{background:var(--accent-soft);color:var(--accent)}
.qbadge.warn{background:var(--warn-soft);color:var(--warn)}
.qbadge.risk{background:#F7ECEA;color:var(--danger)}

/* ===== アカウント詳細ドロワー ===== */
dialog.drawer{
  position:fixed;inset:0 0 0 auto;height:100dvh;max-height:100dvh;width:400px;max-width:92vw;
  margin:0;border:0;border-left:1px solid var(--rule);background:var(--paper);
  padding:18px 20px;overflow-y:auto;
}
dialog.drawer::backdrop{background:rgba(22,23,26,.22)}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.drawer-head a{font-family:var(--mono);font-size:16px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.drawer-head a:hover{color:var(--accent)}
.afull{font-size:12px;color:var(--dim);margin-left:8px}
.abio{font-size:12px;color:var(--dim);line-height:1.6;margin:4px 0 12px}
.astats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:16px}
.astats>div{background:var(--card);padding:9px 10px}
.astats b{display:block;font-family:var(--mono);font-size:15px;font-weight:500}
.astats span{font-size:10px;color:var(--dim)}
.aflags{list-style:none;margin:0 0 14px;padding:0}
.aflags li{font-size:11.5px;padding:5px 0 5px 15px;position:relative;line-height:1.5;color:var(--ink)}
.aflags li::before{content:"⚑";position:absolute;left:0;color:var(--danger);font-size:10px}
.aflags li.clean{color:var(--dim)}
.aflags li.clean::before{content:"✓";color:var(--accent)}
.apills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.apills span{font-size:10.5px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono)}
.apills .none{background:transparent;color:var(--muted)}
.asim{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.asim button{
  display:flex;justify-content:space-between;gap:8px;text-align:left;padding:7px 10px;
  background:var(--card);border:1px solid var(--rule);cursor:pointer;font-family:var(--mono);font-size:11.5px;
}
.asim button:hover{border-color:var(--accent)}
.asim .sf{color:var(--dim);font-size:10.5px}
#aChart{margin-bottom:14px}
#aChart svg{display:block;width:100%;height:72px;background:var(--card);border:1px solid var(--rule)}
#aChart .empty-chart{font-size:11px;color:var(--muted);padding:14px;background:var(--card);border:1px solid var(--rule)}

/* ===== narrow screens: stacking is correct here ===== */
@media(max-width:880px){
  html,body{overflow:auto}
  .app{height:auto}
  #view-search,#view-lists{grid-template-columns:1fr}
  .panel,.lnav{border-right:0;border-bottom:1px solid var(--rule)}
  .panel-scroll,.lnav-scroll{overflow:visible}
  .scroller{overflow:visible}
  thead th{position:static}
}
</style>
</head>
<body>
<div class="app">

<div class="bar">
  <span class="brand">influencer<span class="dot">·</span>radar</span>
  <div class="navtabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="search" data-i18n="tabSearch"></button>
    <button role="tab" aria-selected="false" data-view="lists">
      <span data-i18n="tabLists"></span><span class="cnt" id="listCnt"></span>
    </button>
    <button role="tab" aria-selected="false" data-view="db">
      <span data-i18n="tabDb"></span><span class="cnt" id="dbCnt"></span>
    </button>
  </div>
  <span class="push"></span>
  <select id="groupSel" class="gsel" hidden></select>
  <button class="btn ghost xs" id="groupBtn" data-i18n="groupBtn" hidden></button>
  <span class="uname" id="uname"></span>
  <button class="btn ghost xs" id="logoutBtn" data-i18n="logoutBtn" hidden></button>
  <button class="btn ghost xs" id="setupBtn" data-i18n="setupBtn"></button>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="ja" aria-pressed="true">JA</button>
    <button data-lang="en" aria-pressed="false">EN</button>
    <button data-lang="zh" aria-pressed="false">ZH</button>
  </div>
</div>

<!-- ══════════ SEARCH ══════════ -->
<div class="view" id="view-search">

  <div class="panel">

let LANG = localStorage.getItem("radar_lang") || "ja";
let VIEW = "search";
let RESULTS = [], STATS = null, JOB = null, timer = null;
let SORT = {k:"followers", d:-1}, LSORT = {k:"added_at", d:-1};
let LISTS = [], CUR = null, ITEMS = [], pending = [];

const $ = id => document.getElementById(id);
const t = () => I18N[LANG];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ---------- 認証状態 ---------- */
let ME = null;          // {user:{id,username}, groups:[...], active_group}
const me = () => ME ? ME.user.username : "";

function toast(m){
  const el = $("toast"); el.textContent = m; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 2100);
}

const tokens = {
  apify: () => localStorage.getItem("radar_tok_apify") || "",
  anthropic: () => localStorage.getItem("radar_tok_anthropic") || "",
};
const hasAI = () => !!tokens.anthropic();

async function api(url, opts={}){
  const r = await fetch(url, {credentials:"same-origin", headers:{
    "Content-Type":"application/json",
    "X-Apify-Token":tokens.apify(),
    "X-Anthropic-Key":tokens.anthropic(),
  }, ...opts});
  const d = await r.json().catch(()=>({}));
  if (r.status === 401 && !url.startsWith("/api/auth/")){ showAuth(true); throw new Error("auth_required"); }
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

/* ---------- ログイン／登録 ---------- */
let AUTH_MODE = "login";
function showAuth(on){
  $("authWall").hidden = !on;
  if (on){ renderAuth(); $("authU").focus(); }
}
function renderAuth(){
  const d = t();
  $("authTitle").textContent = AUTH_MODE === "login" ? d.authLoginTitle : d.authRegTitle;
  $("authGo").textContent   = AUTH_MODE === "login" ? d.authLoginBtn  : d.authRegBtn;
  $("authSwap").textContent = AUTH_MODE === "login" ? d.authToReg     : d.authToLogin;
  $("authMsg").textContent = "";
}
$("authSwap").onclick = ()=>{ AUTH_MODE = AUTH_MODE === "login" ? "register" : "login"; renderAuth(); };
$("authGo").onclick = async ()=>{
  const d = t();
  const body = JSON.stringify({username:$("authU").value.trim(), password:$("authP").value});
  try{
    await api(`/api/auth/${AUTH_MODE === "login" ? "login" : "register"}`, {method:"POST", body});
    $("authP").value = "";
    await boot();
  }catch(e){
    $("authMsg").textContent = d.authErr[e.message] || d.authErr.generic;
  }
};
$("authP").addEventListener("keydown", e=>{ if (e.key === "Enter") $("authGo").click(); });

$("logoutBtn").onclick = async ()=>{
  await api("/api/auth/logout", {method:"POST"});
  ME = null; location.reload();
};

/* ---------- グループ ---------- */
function renderGroupBar(){
  const d = t();
  const has = ME && ME.groups.length > 0;
  $("groupSel").hidden = !has;
  $("groupBtn").hidden = !ME;
  $("logoutBtn").hidden = !ME;
  $("uname").textContent = ME ? ME.user.username : "";
  if (has){
    $("groupSel").innerHTML = ME.groups.map(g=>
      `<option value="${g.id}" ${g.id===ME.active_group?"selected":""}>${esc(g.name)}</option>`).join("");
  }
}
$("groupSel").onchange = async e=>{
  await api("/api/groups/switch",{method:"POST",body:JSON.stringify({group_id:+e.target.value})});
  await boot();
};
$("groupBtn").onclick = ()=>{ renderGroupDlg(); $("groupDlg").showModal(); };
$("grpClose").onclick = ()=> $("groupDlg").close();

function renderGroupDlg(){
  const d = t();
  $("grpMine").innerHTML = ME.groups.map(g=>`
    <div class="grp-row">
      <b>${esc(g.name)}</b>
      <span class="dim">${g.member_count}${d.grpMembers}</span>
      <span class="push"></span>
      <span class="code" data-code="${esc(g.invite_code)}" title="${esc(d.grpCopyTip)}">${esc(g.invite_code)}</span>
    </div>`).join("") || `<p class="pnote">${esc(d.grpNone)}</p>`;
  $("grpMine").querySelectorAll(".code").forEach(el=>{
    el.onclick = ()=>{ navigator.clipboard.writeText(el.dataset.code); toast(d.grpCopied); };
  });
  $("grpMsg").textContent = "";
}
$("grpCreateBtn").onclick = async ()=>{
  const name = $("grpName").value.trim(); if (!name) return;
  try{
    await api("/api/groups",{method:"POST",body:JSON.stringify({name})});
    $("grpName").value = "";
    await boot(); renderGroupDlg();
  }catch(e){ $("grpMsg").textContent = t().grpErr[e.message] || e.message; }
};
$("grpJoinBtn").onclick = async ()=>{
  const code = $("grpCode").value.trim(); if (!code) return;
  try{
    await api("/api/groups/join",{method:"POST",body:JSON.stringify({code})});
    $("grpCode").value = "";
    await boot(); renderGroupDlg();
  }catch(e){ $("grpMsg").textContent = t().grpErr[e.message] || e.message; }
};

/* ---------- 起動 ---------- */
async function boot(){
  try{
    ME = await fetch("/api/me", {credentials:"same-origin"}).then(r=> r.ok ? r.json() : null);
  }catch(_){ ME = null; }
  if (!ME){ showAuth(true); return; }
  showAuth(false);
  renderGroupBar();
  loadLists();
  // グループ未所属なら管理ダイアログを開いて作成/参加を促す
  if (!ME.groups.length){ renderGroupDlg(); $("groupDlg").showModal(); }
}

/* ---------- トークン設定 ---------- */
$("setupBtn").onclick = ()=>{
  $("tokApify").value = tokens.apify();
  $("tokAnthropic").value = tokens.anthropic();
  $("setup").showModal();
};
$("setupCancel").onclick = ()=> $("setup").close();
$("setupSave").onclick = ()=>{
  localStorage.setItem("radar_tok_apify", $("tokApify").value.trim());
  localStorage.setItem("radar_tok_anthropic", $("tokAnthropic").value.trim());
  $("setup").close();

};

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang = LANG;
  const d = t();
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = d[el.dataset.i18n]; if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    el.placeholder = d[el.dataset.i18nPh] || "";
  });
  $("parseHint").textContent = hasAI() ? d.parseHint : d.parseHintNoAI;
  $("parseBtn").disabled = !hasAI();
  if (!$("authWall").hidden) renderAuth();

  $("chips").innerHTML = "";
  d.examples.forEach(ex=>{
    const b = document.createElement("button");
    b.textContent = ex; b.onclick = ()=>{ $("brief").value = ex; };
    $("chips").appendChild(b);
  });

  $("naList").innerHTML = d.naItems.map(x=>`<li>${esc(x)}</li>`).join("");

  const keep = $("lStatus").value;
  $("lStatus").innerHTML = `<option value="">${esc(d.stAll)}</option>` +
    Object.entries(d.statuses).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  $("lStatus").value = keep;

  document.querySelectorAll(".langs button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));

  renderResults(); renderNav(); renderItems();
}
document.querySelectorAll(".langs button").forEach(b=>{
  b.onclick = ()=>{ LANG = b.dataset.lang; localStorage.setItem("radar_lang",LANG); applyLang(); };
});

/* ---------- views ---------- */
document.querySelectorAll(".navtabs button").forEach(b=>{
  b.onclick = ()=>{
    VIEW = b.dataset.view;
    document.querySelectorAll(".navtabs button").forEach(x=>
      x.setAttribute("aria-selected", String(x.dataset.view === VIEW)));
    $("view-search").hidden = VIEW !== "search";
    $("view-lists").hidden  = VIEW !== "lists";

/* ---------- brief -> filters ---------- */
$("parseBtn").onclick = async ()=>{
  const brief = $("brief").value.trim(); if (!brief) return;
  $("parseMsg").textContent = ""; $("parseBtn").disabled = true;
  const prev = $("parseHint").textContent; $("parseHint").textContent = "…";
  try{
    const {filters:f} = await api("/api/parse",{method:"POST",body:JSON.stringify({brief,lang:LANG})});
    $("hashtag").value = (f.hashtags && f.hashtags.length ? f.hashtags : (f.hashtag ? [f.hashtag] : [])).join("\n");
    HASHTAG_MODE = f.hashtag_mode === "intersect" ? "intersect" : "union";
    document.querySelectorAll(".seg-btn").forEach(x=> x.classList.toggle("active", x.dataset.mode === HASHTAG_MODE));
    $("hashtag").dispatchEvent(new Event("input"));
    $("minF").value = f.min_followers; $("maxF").value = f.max_followers;
    // AI は「30日以内」など任意の日数を返しうるが、選択肢は3ヶ月/6ヶ月しかない。
    // 一番近い選択肢に寄せる（そのまま代入すると選択が空になる）。
    const days = +f.active_days || 0;
    $("activeDays").value = !days || days > 270 ? "" : (days <= 135 ? "90" : "180");
    $("minEr").value = f.min_engagement || 0;
    $("gender").value = f.gender || "any";
    $("ageMin").value = f.age_min ?? ""; $("ageMax").value = f.age_max ?? "";
    $("narration").checked = !!f.narration_only;
    $("contentKw").value = (f.content_keywords || []).join(", ");
    $("profileKw").value = f.profile_keyword || "";
    $("captionKw").value = f.caption_keyword || "";
    $("mention").value = f.mention || "";
    $("accountType").value = f.account_type || "any";
    $("hasPr").value = f.has_pr || "any";
    $("hasContact").checked = !!f.has_contact;
    $("verifiedOnly").checked = !!f.verified_only;
    $("minReel").value = f.min_reel_views ?? "";
    $("minPosts").value = f.min_posts ?? "";
    $("region").value = f.region || "";
    $("parseHint").textContent = f.notes || prev;
  }catch(e){
    $("parseMsg").textContent = t().errParse + e.message;
    $("parseHint").textContent = prev;
  }finally{ $("parseBtn").disabled = false; }
};

/* ---------- search ---------- */
let HASHTAG_MODE = "union";
document.querySelectorAll(".seg-btn").forEach(b=>{
  b.onclick = ()=>{
    HASHTAG_MODE = b.dataset.mode;
    document.querySelectorAll(".seg-btn").forEach(x=> x.classList.toggle("active", x===b));
  };
});
function parseHashtags(){
  return $("hashtag").value.split(/[\n,、]/).map(s=>s.trim().replace(/^#/,"")).filter(Boolean).slice(0,5);
}
$("hashtag").addEventListener("input", ()=>{
  const n = parseHashtags().length;
  $("hashtagModeWrap").hidden = n < 2;
  if (n >= 2) $("hashtagModeHelp").textContent = t().hmHelp(n);
});

$("runBtn").onclick = async ()=>{
  const hashtags = parseHashtags();
  const usernames = $("usernames").value.split(/[\n,]/).map(s=>s.trim().replace(/^@/,"")).filter(Boolean);
  $("runMsg").textContent = "";
  if (!tokens.apify()){ $("runMsg").textContent = t().errNoToken; $("setupBtn").focus(); return; }
  if (!ME || !ME.groups.length){ $("runMsg").textContent = t().grpErr.no_group; renderGroupDlg(); $("groupDlg").showModal(); return; }
  if (!hashtags.length && !usernames.length){ $("runMsg").textContent = t().errNoHashtag; return; }
  const p = {
    hashtags, hashtag_mode: HASHTAG_MODE, usernames,
    min_followers:+$("minF").value || 0,
    max_followers:+$("maxF").value || 100000000,
    active_days:$("activeDays").value ? +$("activeDays").value : 36500,
    min_engagement:+$("minEr").value || 0,
    min_reel_views:+$("minReel").value || null,
    min_posts:+$("minPosts").value || null,
    account_type:$("accountType").value,
    profile_keyword:$("profileKw").value.trim(),
    caption_keyword:$("captionKw").value.trim(),
    mention:$("mention").value.trim().replace(/^@/,""),
    has_pr:$("hasPr").value,
    has_contact:$("hasContact").checked,
    verified_only:$("verifiedOnly").checked,
    exclude_saved:$("excludeSaved").checked,
    region:$("region").value.trim(),
    gender:$("gender").value,
    age_min:$("ageMin").value ? +$("ageMin").value : null,
    age_max:$("ageMax").value ? +$("ageMax").value : null,
    narration_only:$("narration").checked,
    content_keywords:$("contentKw").value.split(",").map(s=>s.trim()).filter(Boolean),
    posts_limit:200, use_llm:$("useLlm").checked, user:me()
  };
  $("runBtn").disabled = true;
  $("state").innerHTML = `<span class="live">${esc(t().stages.queued)}</span>`;
  try{
    const {job_id} = await api("/api/search",{method:"POST",body:JSON.stringify(p)});
    JOB = job_id; poll(job_id);
  }catch(e){
    $("runMsg").textContent = t().errRun + e.message;
    $("runBtn").disabled = false; $("state").textContent = "";
  }
};

function stageText(s){
  const d = t(); if (!s) return "";
  if (s.startsWith("accounts_found:")) return d.found(s.split(":")[1]);
  if (s.startsWith("profiles:")){ const [a,b] = s.split(":")[1].split("/"); return d.prof(a,b); }
  if (s.startsWith("llm:")){ const [a,b] = s.split(":")[1].split("/"); return d.llmStage(a,b); }
  return d.stages[s] || s;
}

function poll(id){
  clearInterval(timer);
  timer = setInterval(async ()=>{
    try{
      const j = await api(`/api/status/${id}`);
      $("state").innerHTML = `<span class="live">${esc(stageText(j.stage))}</span>`;
      if (j.status === "done"){
        clearInterval(timer);
        RESULTS = j.results || []; STATS = j.stats;
        $("state").textContent = t().stages.done;
        $("runBtn").disabled = false;
        renderResults(); refreshSaved();
      }
      if (j.status === "error"){
        clearInterval(timer);
        $("runMsg").textContent = t().errRun + (j.error || "");
        $("state").textContent = ""; $("runBtn").disabled = false;
      }
    }catch(e){}
  }, 2000);
}

/* ---------- results ---------- */
const COLS = ["username","followers","growth","engagement","avg_reel_views","last_post",
              "account_type","quality","pr_count","email","narration","gender","age","content","bio"];
const NUM = new Set(["followers","engagement","growth","avg_reel_views","pr_count","posts_count"]);

function sortRows(rows, s){
  return rows.sort((a,b)=>{
    let x = a[s.k], y = b[s.k];
    if (NUM.has(s.k)) return ((+x||0)-(+y||0))*s.d;
    return String(x??"").localeCompare(String(y??""))*s.d;
  });
}

/* Instagram の画像 URL は署名付きで期限切れになることがあるため、
   読み込み失敗時は頭文字のプレースホルダに差し替える。
   referrerpolicy はホットリンク対策で必須。 */
function avatarHTML(username, src){
  const l = esc((username || "?").slice(0, 1));
  if (!src) return `<span class="av-fallback">${l}</span>`;
  return `<img class="av" src="${esc(src)}" data-l="${l}" loading="lazy" referrerpolicy="no-referrer"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'av-fallback',textContent:this.dataset.l}))">`;
}

function visible(){
  const q = $("rq").value.trim().toLowerCase();
  const mf = +$("rMinF").value||0, mer = +$("rMinEr").value||0;
  const g = $("rGender").value, n = $("rNarr").value;
  return sortRows(RESULTS.filter(r=>{
    if (r.followers < mf || r.engagement < mer) return false;
    if (g && r.gender !== g) return false;
    if (n === "yes" && !["yes","partial"].includes(r.narration)) return false;
    if (n === "no" && r.narration !== "no") return false;
    if (q && !`${r.username} ${r.full_name} ${r.bio} ${r.content}`.toLowerCase().includes(q)) return false;
    return true;
  }), SORT);
}

function headHTML(cols, sort, attr, d, withAvatar){
  const label = c => ({growth:d.colGrowth, account_type:d.colType,
                       avg_reel_views:d.colReel, pr_count:d.colPr,
                       email:d.colEmail, list_name:d.inList}[c]) || d.cols[c] || c;
  return `<th class="fixed"><input type="checkbox" class="tick row" id="all"></th>` +
    (withAvatar ? `<th class="fixed avatar-th"></th>` : "") +
    cols.map(c=>`<th ${attr}="${c}">${esc(label(c))}${sort.k===c?`<span class="ar">${sort.d<0?"↓":"↑"}</span>`:""}</th>`).join("") +
    `<th class="fixed"></th>`;
}

function keyLegend(d){
  return `<span class="key">${esc(d.keyline)}</span>
    <span class="key"><i class="cf high"></i>${esc(d.keyHigh)}</span>
    <span class="key"><i class="cf medium"></i>${esc(d.keyMed)}</span>
    <span class="key"><i class="cf low"></i>${esc(d.keyLow)}</span>
    <span class="key"><i class="cf unknown"></i>${esc(d.keyUnk)}</span>`;
}

function renderResults(){
  const d = t();
  if (!STATS && !RESULTS.length){
    $("rhead").innerHTML = "";
    $("rbody").innerHTML = `<tr><td class="blank">${esc(d.blankStart)}</td></tr>`;
    $("rfoot").innerHTML = "";
    return;
  }
  const rows = visible();
  $("rhead").innerHTML = headHTML(COLS, SORT, "data-s", d, true);
  $("rhead").querySelectorAll("th[data-s]").forEach(th=>{
    th.onclick = ()=>{
      const k = th.dataset.s;
      SORT = SORT.k===k ? {k, d:-SORT.d} : {k, d:NUM.has(k)?-1:1};
      renderResults();
    };
  });
  $("all").onchange = e =>
    document.querySelectorAll("#rbody .tick").forEach(c=> c.checked = e.target.checked);

  $("rbody").innerHTML = rows.length ? rows.map(r=>`
    <tr data-u="${esc(r.username)}">
      <td><input type="checkbox" class="tick row"></td>
      <td class="fixed">${avatarHTML(r.username, r.avatar)}</td>
      <td class="acct"><a href="${esc(r.url)}" target="_blank" rel="noopener">@${esc(r.username)}</a>${r.verified?'<span class="vf">✓</span>':""}</td>
      <td class="num">${(+r.followers).toLocaleString()}</td>
      <td class="num ${r.growth > 0 ? "up" : r.growth < 0 ? "down" : ""}">${r.growth == null ? "—" : (r.growth > 0 ? "+" : "") + r.growth + "%"}</td>
      <td class="num">${esc(r.engagement)}</td>
      <td class="num">${r.avg_reel_views ? (+r.avg_reel_views).toLocaleString() : "—"}</td>
      <td>${esc(r.last_post)}</td>
      <td>${esc(d[{business:"atBiz",creator:"atCreator",personal:"atPersonal"}[r.account_type]] || "—")}</td>
      <td>${r.quality ? `<i class="q ${esc(r.quality)}" data-open="${esc(r.username)}" title="${esc(d["q_"+r.quality]||"")}"></i>` : "—"}</td>
      <td class="num">${r.pr_count || "—"}</td>
      <td>${r.email ? `<a href="mailto:${esc(r.email)}">✉</a>` : "—"}</td>
      <td>${esc(d.narr[r.narration] ?? r.narration)}<i class="cf ${esc(r.narration_conf)}"></i></td>
      <td>${esc(d.gen[r.gender] ?? r.gender)}<i class="cf ${esc(r.gender_conf)}"></i></td>
      <td>${esc(r.age === "unknown" ? "—" : r.age)}<i class="cf ${esc(r.age_conf)}"></i></td>
      <td>${esc(r.content === "unknown" ? "—" : r.content)}<i class="cf ${esc(r.content_conf)}"></i></td>
      <td class="bio" title="${esc(r.bio)}">${esc(r.bio)}</td>
      <td>${SAVED[r.username]
            ? `<button class="plus done" data-add="${esc(r.username)}" title="${esc(SAVED[r.username].join(", "))}">✓</button>`
            : `<button class="plus" data-add="${esc(r.username)}">+</button>`}</td>
    </tr>`).join("")
    : `<tr><td colspan="${COLS.length+3}" class="blank">${esc(d.blankNone)}</td></tr>`;

  $("rbody").querySelectorAll("[data-add]").forEach(b=>{

  $("rbody").querySelectorAll("[data-open]").forEach(el=>{
    el.onclick = e=>{ e.preventDefault(); openAccount(el.dataset.open); };
  });

  $("rfoot").innerHTML = (STATS ? d.foot(STATS.posts, STATS.accounts, STATS.matched, rows.length) : "") +
    `<span class="push"></span>` + keyLegend(d);
}

/* ---------- save dialog ---------- */
async function openSave(items){
  pending = items;
  await loadLists();
  $("dlgList").innerHTML = LISTS.map(l=>`<option value="${l.id}">${esc(l.name)} (${l.count})</option>`).join("");
  $("dlgNew").value = "";
  $("dlg").showModal();
}
$("dlgCancel").onclick = ()=> $("dlg").close();
$("dlgSave").onclick = async ()=>{
  const nn = $("dlgNew").value.trim();
  try{
    let id, name;
    if (nn){ const c = await api("/api/lists",{method:"POST",body:JSON.stringify({name:nn,user:me()})}); id=c.id; name=c.name; }
    else { id = +$("dlgList").value; name = LISTS.find(l=>l.id===id)?.name || ""; }
    if (!id) return;
    await api(`/api/lists/${id}/items`,{method:"POST",body:JSON.stringify({items:pending,user:me()})});

  }catch(e){ toast(e.message === "duplicate_name" ? t().dupName : e.message); }

/* ---------- lists + folders ---------- */
let TREE = {folders:[], loose:[], total_lists:0, total_items:0};
let GLOBAL = null;   // 横断検索の結果。null なら通常のリスト表示
let SAVED = {};      // {username: [リスト名]}

async function loadLists(){
  try{
    TREE = await api("/api/tree");
    LISTS = [...TREE.folders.flatMap(f=>f.lists), ...TREE.loose];
    $("listCnt").textContent = TREE.total_lists || "";
    renderNav(); renderMoveTo();
    if (VIEW === "lists" && !GLOBAL){
      if (CUR && !LISTS.find(l=>l.id===CUR)) CUR = null;
      if (!CUR && LISTS.length) CUR = LISTS[0].id;
      if (CUR) await loadItems(CUR); else { ITEMS=[]; $("lTitle").textContent=""; renderItems(); }
    }
  }catch(e){}
  return LISTS;
}

function listBtn(l){
  return `<button class="li" data-l="${l.id}" aria-current="${l.id===CUR && !GLOBAL}">
    <span class="ln">${esc(l.name)}</span><span class="n">${l.count}</span></button>`;
}

function renderNav(){
  const d = t();
  const open = new Set([...document.querySelectorAll(".fold[open]")].map(x=>x.dataset.f));
  let html = "";

  for (const f of TREE.folders){
    const isOpen = open.size ? open.has(String(f.id)) : true;
    html += `<details class="fold" data-f="${f.id}" ${isOpen?"open":""}>
      <summary>
        <span class="fn">${esc(f.name)}</span>
        <span class="tot">${f.total}</span>
        <button class="fx" data-rf="${f.id}" title="${esc(d.delFolder)}">×</button>
      </summary>
      ${f.lists.map(listBtn).join("") || `<div class="blank" style="padding:10px;font-size:10.5px">—</div>`}
    </details>`;
  }
  if (TREE.loose.length){
    html += `<details class="fold loose" data-f="none" open>
      <summary><span class="fn">${esc(d.uncat)}</span><span class="tot">${TREE.loose.reduce((a,b)=>a+b.count,0)}</span></summary>
      ${TREE.loose.map(listBtn).join("")}
    </details>`;
  }
  if (!TREE.total_lists) html = `<div class="blank" style="padding:20px 12px;font-size:11px">${esc(d.blankNoList)}</div>`;

  $("lnav").innerHTML = html;
  $("lnav").querySelectorAll("[data-l]").forEach(b=>{
    b.onclick = ()=>{ GLOBAL = null; $("gq").value = ""; CUR = +b.dataset.l; loadItems(CUR); renderNav(); };
  });
  $("lnav").querySelectorAll("[data-rf]").forEach(b=>{
    b.onclick = async e=>{
      e.preventDefault(); e.stopPropagation();
      const f = TREE.folders.find(x=>x.id === +b.dataset.rf);
      if (!confirm(t().confirmDelF(f?.name || ""))) return;
      await api(`/api/folders/${b.dataset.rf}`,{method:"DELETE"});
      await loadLists();
    };
  });
}

function renderMoveTo(){
  const d = t();
  $("moveTo").innerHTML = `<option value="">${esc(d.moveTo)}</option>` +
    `<option value="none">${esc(d.uncat)}</option>` +
    TREE.folders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join("");
}
$("moveTo").onchange = async ()=>{
  const v = $("moveTo").value;
  if (!CUR || !v) return;
  await api(`/api/lists/${CUR}/move`,{method:"POST",
    body: JSON.stringify({folder_id: v === "none" ? null : +v})});

  await loadLists();
};

const addList = async ()=>{
  const name = $("newName").value.trim(); if (!name) return;
  try{
    const c = await api("/api/lists",{method:"POST",body:JSON.stringify({name,user:me()})});

$("newBtn").onclick = addList;
$("newName").onkeydown = e=>{ if (e.key === "Enter") addList(); };

const addFolder = async ()=>{
  const name = $("newFolder").value.trim(); if (!name) return;

/* 横断検索: 全リストから人を探す */
let gqTimer;
$("gq").oninput = ()=>{
  clearTimeout(gqTimer);
  gqTimer = setTimeout(async ()=>{
    const q = $("gq").value.trim();
    if (!q){ GLOBAL = null; renderNav(); if (CUR) loadItems(CUR); else renderItems(); return; }

async function loadItems(id){
  const {list, items} = await api(`/api/lists/${id}`);
  CUR = list.id; ITEMS = items; GLOBAL = null;
  $("lTitle").textContent = list.name; renderItems();
}

const LCOLS = ["username","followers","engagement","last_post","gender","content","item_status","note","added_by"];
const GCOLS = ["username","followers","engagement","list_name","item_status","note","added_by"];

function visibleItems(){
  const q = $("lq").value.trim().toLowerCase(), st = $("lStatus").value;
  return sortRows(ITEMS.filter(i=>{
    if (st && i.item_status !== st) return false;
    if (q && !`${i.username} ${i.full_name} ${i.bio} ${i.note}`.toLowerCase().includes(q)) return false;
    return true;
  }), LSORT);
}

function renderItems(){
  const d = t();
  const cols = GLOBAL ? GCOLS : LCOLS;
  const onList = !GLOBAL && CUR;

  ["lCsv","lRename","lDel"].forEach(id=> $(id).disabled = !onList);
  $("moveTo").disabled = !onList;

  if (!CUR && !GLOBAL){ $("lhead").innerHTML=""; $("lbody").innerHTML=""; $("lfoot").innerHTML=""; return; }
  const rows = visibleItems();

  $("lhead").innerHTML = cols.map(c=>
    `<th data-ls="${c}">${esc(c === "list_name" ? d.inList : (d.cols[c]||c))}${LSORT.k===c?`<span class="ar">${LSORT.d<0?"↓":"↑"}</span>`:""}</th>`
  ).join("") + `<th class="fixed"></th>`;
  $("lhead").querySelectorAll("th[data-ls]").forEach(th=>{
    th.onclick = ()=>{
      const k = th.dataset.ls;
      LSORT = LSORT.k===k ? {k, d:-LSORT.d} : {k, d:NUM.has(k)?-1:1};
      renderItems();
    };
  });

  const cell = (i,c)=>{
    if (c === "username") return `<td class="acct"><a href="${esc(i.url)}" target="_blank" rel="noopener">@${esc(i.username)}</a></td>`;
    if (c === "followers") return `<td class="num">${(+i.followers).toLocaleString()}</td>`;
    if (c === "engagement") return `<td class="num">${esc(i.engagement)}</td>`;
    if (c === "last_post") return `<td>${esc(i.last_post)}</td>`;
    if (c === "gender") return `<td>${esc(d.gen[i.gender] ?? i.gender)}<i class="cf ${esc(i.gender_conf)}"></i></td>`;
    if (c === "content") return `<td>${esc(i.content === "unknown" ? "—" : i.content)}</td>`;
    if (c === "list_name") return `<td class="crumb">${i.folder_name ? esc(i.folder_name)+" / " : ""}${esc(i.list_name)}</td>`;
    if (c === "item_status") return `<td><select class="sel" data-st="${i.item_id}">${Object.entries(d.statuses).map(([k,v])=>
        `<option value="${k}" ${i.item_status===k?"selected":""}>${esc(v)}</option>`).join("")}</select></td>`;
    if (c === "note") return `<td><input class="note" data-nt="${i.item_id}" value="${esc(i.note)}"></td>`;
    if (c === "added_by") return `<td>${esc(i.added_by)}</td>`;
    return `<td></td>`;
  };

  $("lbody").innerHTML = rows.length
    ? rows.map(i=>`<tr>${cols.map(c=>cell(i,c)).join("")}<td><button class="x" data-rm="${i.item_id}">×</button></td></tr>`).join("")
    : `<tr><td colspan="${cols.length+1}" class="blank">${esc(GLOBAL ? d.blankSearch : d.blankList)}</td></tr>`;

  $("lbody").querySelectorAll("[data-st]").forEach(s=>{
    s.onchange = async ()=>{
      await api(`/api/items/${s.dataset.st}`,{method:"PATCH",body:JSON.stringify({status:s.value})});
      const it = ITEMS.find(x=>String(x.item_id)===s.dataset.st); if (it) it.item_status = s.value;
    };
  });
  $("lbody").querySelectorAll("[data-nt]").forEach(inp=>{
    let tm;
    inp.oninput = ()=>{
      clearTimeout(tm);
      tm = setTimeout(async ()=>{
        await api(`/api/items/${inp.dataset.nt}`,{method:"PATCH",body:JSON.stringify({note:inp.value})});
        const it = ITEMS.find(x=>String(x.item_id)===inp.dataset.nt); if (it) it.note = inp.value;
      }, 600);
    };
  });
  $("lbody").querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick = async ()=>{
      await api(`/api/items/${b.dataset.rm}`,{method:"DELETE"});
      ITEMS = ITEMS.filter(x=>String(x.item_id)!==b.dataset.rm);
      renderItems(); loadLists();
    };
  });

  $("lfoot").innerHTML = (GLOBAL ? d.gfoot(rows.length) : d.lfoot(ITEMS.length, rows.length)) +
    `<span class="push"></span>` + keyLegend(d);
}

["lq","lStatus"].forEach(id=> $(id).addEventListener("input", ()=> CUR && renderItems()));
$("lCsv").onclick = ()=> CUR && (window.location = `/api/export/list/${CUR}`);
$("lRename").onclick = async ()=>{
  if (!CUR) return;
  const cur = LISTS.find(l=>l.id===CUR);
  const name = prompt(t().rename, cur?.name || ""); if (!name) return;
  try{
    await api(`/api/lists/${CUR}`,{method:"PATCH",body:JSON.stringify({name})});
    await loadLists(); $("lTitle").textContent = name;
  }catch(e){ toast(e.message === "duplicate_name" ? t().dupName : e.message); }
};
$("lDel").onclick = async ()=>{
  if (!CUR) return;
  const cur = LISTS.find(l=>l.id===CUR);
  if (!confirm(t().confirmDel(cur?.name || ""))) return;
  await api(`/api/lists/${CUR}`,{method:"DELETE"});
  CUR = null; ITEMS = []; $("lTitle").textContent = "";
  await loadLists(); renderItems();
};

/* ---------- 蓄積データベース ---------- */
let DB_ROWS = [];
async function loadDb(){

  if (q) p.set("q", q);

let dbTimer;
["dbq","dbMinF","dbMaxF","dbSort"].forEach(id=>
  $(id).addEventListener("input", ()=>{ clearTimeout(dbTimer); dbTimer=setTimeout(loadDb, 300); }));

/* ---------- アカウント詳細ドロワー ---------- */
function sparkline(hist){
  if (!hist || hist.length < 2)
    return `<div class="empty-chart">${esc(t().dHistoryNone)}</div>`;
  const W=360, H=72, P=8;
  const vals = hist.map(h=>h.followers);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = (hi - lo) || 1;
  const x = i => P + i * (W - 2*P) / (hist.length - 1);
  const y = v => H - P - (v - lo) * (H - 2*P) / span;
  const pts = hist.map((h,i)=>`${x(i).toFixed(1)},${y(h.followers).toFixed(1)}`).join(" ");
  const first = hist[0], last = hist[hist.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    <polyline points="${pts}" fill="none" stroke="#0F6B5C" stroke-width="1.6"/>
    <circle cx="${x(hist.length-1)}" cy="${y(last.followers)}" r="2.4" fill="#0F6B5C"/>
    <text x="${P}" y="${H-2}" font-size="8" fill="#98988F" font-family="monospace">${esc(first.date)} ${first.followers.toLocaleString()}</text>
    <text x="${W-P}" y="10" font-size="8" fill="#16171A" text-anchor="end" font-family="monospace">${esc(last.date)} ${last.followers.toLocaleString()}</text>
  </svg>`;
}

async function openAccount(username){
  let a;
  try{ a = (await api(`/api/accounts/${encodeURIComponent(username)}`)).account; }
  catch(e){ toast(e.message); return; }
  const d = t();
  $("aAvWrap").innerHTML = avatarHTML(a.username, a.avatar).replace('class="av"', 'class="av av-lg"').replace('class="av-fallback"', 'class="av-fallback av-lg"');
  $("aName").textContent = "@" + a.username;
  $("aName").href = a.url;
  $("aFull").textContent = a.full_name || "";
  $("aQual").className = "qbadge " + a.quality;
  $("aQual").textContent = d["q_"+a.quality] || a.quality;
  $("aBio").textContent = a.bio || "";
  $("aStats").innerHTML = [
    [ (+a.followers).toLocaleString(), d.cols.followers ],
    [ a.engagement + "%", d.cols.engagement ],
    [ a.avg_reel_views ? (+a.avg_reel_views).toLocaleString() : "—", d.colReel ],
    [ a.posts_count || "—", d.dPosts ],
    [ a.pr_count || "0", d.colPr ],
    [ a.times_seen, d.dbTimes ],
  ].map(([v,l])=>`<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");
  $("aChart").innerHTML = sparkline(a.history);
  $("aFlags").innerHTML = a.quality_flags.length
    ? a.quality_flags.map(f=>`<li>${esc(d["flag_"+f] || f)}</li>`).join("")
    : `<li class="clean">${esc(d.flagClean)}</li>`;
  $("aLists").innerHTML = a.in_lists.length
    ? a.in_lists.map(n=>`<span>${esc(n)}</span>`).join("")
    : `<span class="none">${esc(d.dNoLists)}</span>`;
  $("aSim").innerHTML = a.similar.length
    ? a.similar.map(s=>`<button data-sim="${esc(s.username)}">
        <span>@${esc(s.username)}</span>
        <span class="sf">${(+s.followers).toLocaleString()} / ${esc(s.engagement)}%</span>
      </button>`).join("")
    : `<span class="none" style="font-size:11px;color:var(--muted)">${esc(d.dSimilarNone)}</span>`;
  $("aSim").querySelectorAll("[data-sim]").forEach(b=>{
    b.onclick = ()=> openAccount(b.dataset.sim);
  });
  if (!$("acct").open) $("acct").showModal();
}
